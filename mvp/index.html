<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Imposter Media (MVP)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #111; color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh; }
    main { max-width: 480px; margin: 0 auto; padding: 16px 14px 32px; }
    h1 { text-align: center; color: #ff3d7f; font-size: 28px; margin: 14px 0 18px;
         letter-spacing: -0.5px; }
    h3 { margin: 4px 0 8px; color: #ccc; font-size: 14px;
         text-transform: uppercase; letter-spacing: 1px; }
    .card { background: #1c1c28; border: 1px solid #2a2a3a; border-radius: 10px;
            padding: 14px; margin-bottom: 12px; }
    label { color: #888; font-size: 12px; text-transform: uppercase;
            letter-spacing: 1px; display: block; margin-bottom: 6px; }
    input, button { width: 100%; padding: 14px 16px; font-size: 16px;
                    border-radius: 10px; border: 1px solid #2e2e42;
                    background: #25253a; color: #eee; font-family: inherit;
                    margin-bottom: 8px; }
    input:focus { outline: none; border-color: #ff3d7f; }
    button { background: #ff3d7f; border: none; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary { background: #25253a; border: 1px solid #3a3a55; }
    .code { font-size: 44px; font-weight: 900; text-align: center;
            letter-spacing: 12px; color: #ff3d7f; padding: 8px 0; }
    .content-box { padding: 36px 16px; text-align: center; font-size: 22px;
                   background: #25253a; border-radius: 10px; font-weight: 800;
                   line-height: 1.3; min-height: 140px;
                   display: flex; align-items: center; justify-content: center; }
    .warn { background: #3a1212; color: #ff8080; padding: 10px;
            border-radius: 8px; text-align: center; font-weight: 800;
            margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; align-items: center;
           padding: 10px 12px; background: #25253a; border-radius: 8px;
           margin-bottom: 6px; }
    .tag { font-size: 11px; padding: 2px 9px; border-radius: 999px;
           background: #ff3d7f; color: white; font-weight: 800;
           text-transform: uppercase; }
    .tag.ghost { background: #3a3a55; color: #aaa; }
    .tag.ok { background: #2bdc8d; color: #082c1a; }
    .word { font-size: 20px; font-weight: 800; color: #ff3d7f; }
    .hint { color: #888; font-size: 13px; text-align: center; margin: 6px 0; }
    .result-head { text-align: center; font-size: 26px; margin: 4px 0; font-weight: 900; }
    .result-head.win  { color: #2bdc8d; }
    .result-head.lose { color: #ff5a5a; }
    .result-card { padding: 12px; margin-bottom: 8px; border-radius: 8px;
                   background: #25253a; }
    .result-card .label { font-size: 11px; color: #888;
                          text-transform: uppercase; letter-spacing: 1px;
                          margin-bottom: 4px; }
    .result-card.normal   { border-left: 4px solid #2bdc8d; }
    .result-card.imposter { border-left: 4px solid #ff5a5a; }
    .error { color: #ff5a5a; text-align: center; min-height: 1em; }
    section, .phase { display: none; }
    section.active, .phase.active { display: block; }
  </style>
</head>
<body>
<main>
  <h1>Imposter Media</h1>

  <!-- Home -->
  <section id="screen-home" class="active">
    <div class="card">
      <label for="name">Your name</label>
      <input id="name" placeholder="Name" maxlength="20" autocomplete="off" />
    </div>
    <div class="card">
      <button id="btn-create">Create a room</button>
    </div>
    <div class="card">
      <label for="code">Or enter a code</label>
      <input id="code" placeholder="XXXX" maxlength="4"
             style="text-transform:uppercase;letter-spacing:8px;text-align:center;font-weight:800" />
      <button id="btn-join" class="secondary">Join room</button>
    </div>
    <p class="error" id="err"></p>
  </section>

  <!-- In a room -->
  <section id="screen-game">

    <div id="p-lobby" class="phase">
      <div class="card">
        <label>Room code</label>
        <div class="code" id="room-code">----</div>
      </div>
      <div class="card">
        <h3>Players</h3>
        <div id="players"></div>
      </div>
      <button id="btn-start" style="display:none">Start game</button>
      <p class="hint" id="lobby-hint"></p>
    </div>

    <div id="p-viewing" class="phase">
      <div class="warn">Don't show your screen to anyone</div>
      <div class="content-box" id="content">—</div>
      <p class="hint">Remember it. The host will hide it when ready.</p>
      <button id="btn-done-viewing" style="display:none">Hide and continue</button>
    </div>

    <div id="p-word" class="phase">
      <h3>Say one word</h3>
      <p class="hint">One word related to what you saw.</p>
      <input id="word" placeholder="your word" maxlength="30" autocomplete="off" />
      <button id="btn-word">Lock it in</button>
      <p class="hint" id="word-msg"></p>
      <div id="word-progress"></div>
    </div>

    <div id="p-reveal" class="phase">
      <h3>Everyone's word</h3>
      <div id="words"></div>
      <button id="btn-start-vote" style="display:none">Start voting</button>
      <p class="hint" id="reveal-hint"></p>
    </div>

    <div id="p-voting" class="phase">
      <h3>Vote the imposter</h3>
      <div id="votes"></div>
      <p class="hint" id="vote-msg"></p>
    </div>

    <div id="p-result" class="phase">
      <div class="result-head" id="result-head"></div>
      <p class="hint" id="result-sub"></p>
      <div class="result-card normal">
        <div class="label">Most players saw</div>
        <div id="result-normal" style="font-weight:700;font-size:17px"></div>
      </div>
      <div class="result-card imposter">
        <div class="label">The imposter saw</div>
        <div id="result-imposter" style="font-weight:700;font-size:17px"></div>
      </div>
      <div class="card" id="result-votes"></div>
      <button id="btn-next" style="display:none">Next round</button>
      <button id="btn-reset" class="secondary" style="display:none">Back to lobby</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let ws = null;

function showScreen(id) {
  document.querySelectorAll("main > section").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}
function showPhase(p) {
  document.querySelectorAll(".phase").forEach(el => el.classList.remove("active"));
  const el = $("p-" + p);
  if (el) el.classList.add("active");
}
function err(msg) { $("err").textContent = msg || ""; }
function esc(s) {
  return String(s ?? "").replace(/[<>&"]/g, c =>
    ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
}

// ----- Create / join -----
async function createRoom() {
  const name = $("name").value.trim();
  if (!name) return err("Enter your name first.");
  err("");
  try {
    const r = await fetch("/api/room", { method: "POST" });
    const { code } = await r.json();
    connect(code, name);
  } catch (e) { err(e.message); }
}
function joinRoom() {
  const name = $("name").value.trim();
  const code = $("code").value.trim().toUpperCase();
  if (!name) return err("Enter your name first.");
  if (code.length !== 4) return err("Code is 4 letters.");
  err("");
  connect(code, name);
}

function connect(code, name) {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws/${code}/${encodeURIComponent(name)}`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "state") render(m.state);
    else if (m.type === "error") err(m.message);
  };
  ws.onopen = () => { showScreen("screen-game"); err(""); };
  ws.onclose = () => { showScreen("screen-home"); };
}
function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

// ----- Render -----
function render(s) {
  $("room-code").textContent = s.code;
  showPhase(s.phase);
  const amHost = s.me.is_host;

  if (s.phase === "lobby") {
    $("players").innerHTML = s.players.map(p =>
      `<div class="row"><span>${esc(p.name)}</span>
       <span>${p.is_host ? '<span class="tag">host</span>' : ''}${p.id===s.me.id?' <span class="tag ghost">you</span>':''}</span>
       </div>`).join("");
    const enough = s.players.length >= 3;
    $("btn-start").style.display = amHost ? "block" : "none";
    $("btn-start").disabled = !enough;
    $("lobby-hint").textContent = !enough
      ? `Need 3+ players to start (${s.players.length}/3).`
      : (amHost ? "Tap Start when everyone's in." : "Waiting for the host…");
  }

  else if (s.phase === "viewing") {
    $("content").textContent = s.me.content ?? "—";
    $("btn-done-viewing").style.display = amHost ? "block" : "none";
  }

  else if (s.phase === "word") {
    const locked = !!s.me.word;
    $("word").disabled = locked;
    $("btn-word").disabled = locked;
    $("word-msg").textContent = locked
      ? `Locked in: "${s.me.word}". Waiting for others…` : "";
    $("word-progress").innerHTML = s.players.map(p =>
      `<div class="row"><span>${esc(p.name)}</span>
       <span class="tag ${p.has_word?'ok':'ghost'}">${p.has_word?'ready':'thinking'}</span>
       </div>`).join("");
  }

  else if (s.phase === "reveal") {
    $("words").innerHTML = s.players.map(p =>
      `<div class="row"><span>${esc(p.name)}</span>
       <span class="word">${esc(p.word || '—')}</span>
       </div>`).join("");
    $("btn-start-vote").style.display = amHost ? "block" : "none";
    $("reveal-hint").textContent = amHost
      ? "Discuss, then start voting." : "Waiting for the host…";
  }

  else if (s.phase === "voting") {
    const myVote = s.me.vote;
    const wrap = $("votes");
    wrap.innerHTML = "";
    s.players.forEach(p => {
      const b = document.createElement("button");
      b.textContent = p.name + (p.id === s.me.id ? " (you)" : "");
      b.className = myVote === p.id ? "" : "secondary";
      b.disabled = !!myVote || p.id === s.me.id;
      b.onclick = () => send({ action: "vote", target: p.id });
      wrap.appendChild(b);
    });
    const voted = s.players.filter(p => p.has_voted).length;
    $("vote-msg").textContent = myVote
      ? `Locked. ${voted}/${s.players.length} voted.`
      : `${voted}/${s.players.length} voted.`;
  }

  else if (s.phase === "result") {
    const r = s.last_result;
    if (!r) return;
    const head = $("result-head");
    head.textContent = r.group_won ? "Group wins!" : "Imposter wins!";
    head.className = "result-head " + (r.group_won ? "win" : "lose");
    $("result-sub").textContent =
      `The imposter was ${r.imposter_name}${r.tied ? " (tie — imposter escapes)" : ""}`;
    $("result-normal").textContent = r.normal;
    $("result-imposter").textContent = r.imposter_content;

    const votesEl = $("result-votes");
    const entries = Object.entries(r.votes || {});
    votesEl.innerHTML = entries.length
      ? entries.map(([n, c]) =>
          `<div class="row"><span>${esc(n)}</span><span>${c} vote${c===1?'':'s'}</span></div>`
        ).join("")
      : '<p class="hint">No votes cast.</p>';

    $("btn-next").style.display  = amHost ? "block" : "none";
    $("btn-reset").style.display = amHost ? "block" : "none";
  }
}

// ----- Wire up -----
$("btn-create").onclick = createRoom;
$("btn-join").onclick   = joinRoom;
$("code").addEventListener("input", e => { e.target.value = e.target.value.toUpperCase(); });

$("btn-start").onclick        = () => send({ action: "start" });
$("btn-done-viewing").onclick = () => send({ action: "done_viewing" });
$("btn-start-vote").onclick   = () => send({ action: "start_vote" });
$("btn-next").onclick         = () => send({ action: "next" });
$("btn-reset").onclick        = () => send({ action: "reset" });

$("btn-word").onclick = () => {
  const raw = $("word").value.trim();
  if (!raw) { $("word-msg").textContent = "Type a word first."; return; }
  if (/\s/.test(raw)) { $("word-msg").textContent = "One word only."; return; }
  send({ action: "word", word: raw });
};
$("word").addEventListener("keydown", e => { if (e.key === "Enter") $("btn-word").click(); });
</script>
</body>
</html>
